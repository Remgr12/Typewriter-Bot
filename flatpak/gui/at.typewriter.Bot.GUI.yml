app-id: at.typewriter.Bot.GUI
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: typewriter-bot-gui
finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --env=JAVA_HOME=/app/jre
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/jvm
      - cp -r $JAVA_HOME /usr/lib/jvm/openjdk-21
      - cp -r /usr/lib/jvm/openjdk-21 /app/jre
    sources:
      - type: file
        path: /usr/lib/jvm/openjdk-21
        dest: jre
  - name: typewriter-bot-gui
    buildsystem: simple
    build-commands:
      - install -Dm755 typewriter-bot-gui-1.0.0.jar /app/bin/typewriter-bot-gui.jar
      - echo '#!/bin/sh' > /app/bin/typewriter-bot-gui
      - echo 'exec /app/jre/bin/java -jar /app/bin/typewriter-bot-gui.jar "$@"' >> /app/bin/typewriter-bot-gui
      - chmod +x /app/bin/typewriter-bot-gui
    sources:
      - type: file
        path: ../gui/build/libs/typewriter-bot-gui-1.0.0.jar
        dest: typewriter-bot-gui-1.0.0.jar