name: Build Linux Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  FLATPAK_BUILDER_VERSION: '1.2.2'

jobs:
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build JVM JARs
        run: ./gradlew :shared:shadowJar :gui:shadowJar --no-daemon

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Add flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak SDK and runtime
        run: |
          flatpak install --user --noninteractive flathub org.freedesktop.Sdk//23.08 org.freedesktop.Platform//23.08
          flatpak install --user --noninteractive flathub org.freedesktop.Sdk.Extension.openjdk21//23.08

      - name: Build Flatpak (CLI)
        run: |
          cd flatpak/cli
          flatpak-builder --user --install --force-clean build-dir at.typewriter.Bot.yml

      - name: Build Flatpak (GUI)
        run: |
          cd flatpak/gui
          flatpak-builder --user --install --force-clean build-dir at.typewriter.Bot.GUI.yml

      - name: Create Flatpak bundle (CLI)
        run: |
          flatpak build-bundle --user repo-cli typewriter-bot.flatpak at.typewriter.Bot
          ls -la typewriter-bot.flatpak

      - name: Create Flatpak bundle (GUI)
        run: |
          flatpak build-bundle --user repo-gui typewriter-bot-gui.flatpak at.typewriter.Bot.GUI
          ls -la typewriter-bot-gui.flatpak

      - name: Upload Flatpak (CLI)
        uses: actions/upload-artifact@v4
        with:
          name: typewriter-bot-linux-flatpak-cli
          path: flatpak/cli/typewriter-bot.flatpak
          retention-days: 30

      - name: Upload Flatpak (GUI)
        uses: actions/upload-artifact@v4
        with:
          name: typewriter-bot-linux-flatpak-gui
          path: flatpak/gui/typewriter-bot-gui.flatpak
          retention-days: 30

  release-flatpak:
    name: Release Flatpak
    needs: build-flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI Flatpak
        uses: actions/download-artifact@v4
        with:
          name: typewriter-bot-linux-flatpak-cli
          path: artifacts

      - name: Download GUI Flatpak
        uses: actions/download-artifact@v4
        with:
          name: typewriter-bot-linux-flatpak-gui
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/typewriter-bot.flatpak
            artifacts/typewriter-bot-gui.flatpak
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true