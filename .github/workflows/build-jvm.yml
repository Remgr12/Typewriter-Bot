name: Build JVM Artifacts

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.8'

jobs:
  build-jvm:
    name: Build JVM JAR (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-name: typewriter-bot-linux
          - os: windows-latest
            artifact-name: typewriter-bot-windows
          - os: macos-latest
            artifact-name: typewriter-bot-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :shared:shadowJar :gui:shadowJar --no-daemon

      - name: Verify JARs
        run: |
          ls -la shared/build/libs/
          ls -la gui/build/libs/
          java -jar shared/build/libs/typewriter-bot-1.0.0.jar --help 2>&1 | head -5 || true
          java -jar gui/build/libs/typewriter-bot-gui-1.0.0.jar --help 2>&1 | head -5 || true

      - name: Upload CLI JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-cli
          path: shared/build/libs/typewriter-bot-1.0.0.jar
          retention-days: 30

      - name: Upload GUI JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-gui
          path: gui/build/libs/typewriter-bot-gui-1.0.0.jar
          retention-days: 30

  release:
    name: Create Release
    needs: build-jvm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: typewriter-bot-*-cli
          merge-multiple: true

      - name: Download GUI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: typewriter-bot-*-gui
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/typewriter-bot-1.0.0.jar
        generate_release_notes: true