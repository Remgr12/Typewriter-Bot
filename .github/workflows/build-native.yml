name: Build Native (Linux/macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GRAALVM_VERSION: 'latest'
  JAVA_VERSION: '21'

jobs:
  build-linux-native:
    name: Build Linux Native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native-image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libfreetype6-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build native image (CLI)
        run: ./gradlew :shared:nativeCompile --no-daemon

      - name: Build native image (GUI)
        run: ./gradlew :gui:nativeCompile --no-daemon

      - name: Verify native executables
        run: |
          ls -la shared/build/native/nativeCompile/
          ls -la gui/build/native/nativeCompile/
          ./shared/build/native/nativeCompile/typewriter-bot --help 2>&1 | head -5 || true
          ./gui/build/native/nativeCompile/typewriter-bot-gui --help 2>&1 | head -5 || true

      - name: Upload CLI native
        uses: actions/upload-artifact@v4
        with:
          name: typewriter-bot-linux-native-cli
          path: shared/build/native/nativeCompile/typewriter-bot
          retention-days: 30

      - name: Upload GUI native
        uses: actions/upload-artifact@v4
        with:
          name: typewriter-bot-linux-native-gui
          path: gui/build/native/nativeCompile/typewriter-bot-gui
          retention-days: 30

  build-macos-native:
    name: Build macOS Native
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build native image (CLI)
        run: ./gradlew :shared:nativeCompile --no-daemon

      - name: Build native image (GUI)
        run: ./gradlew :gui:nativeCompile --no-daemon

      - name: Verify native executables
        run: |
          ls -la shared/build/native/nativeCompile/
          ls -la gui/build/native/nativeCompile/
          ./shared/build/native/nativeCompile/typewriter-bot --help 2>&1 | head -5 || true
          ./gui/build/native/nativeCompile/typewriter-bot-gui --help 2>&1 | head -5 || true

      - name: Upload CLI native
        uses: actions/upload-artifact@v4
        with:
          name: typewriter-bot-macos-native-cli
          path: shared/build/native/nativeCompile/typewriter-bot
          retention-days: 30

      - name: Upload GUI native
        uses: actions/upload-artifact@v4
        with:
          name: typewriter-bot-macos-native-gui
          path: gui/build/native/nativeCompile/typewriter-bot-gui
          retention-days: 30

  release-native:
    name: Release Native (Linux/macOS)
    needs: [build-linux-native, build-macos-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux CLI
        uses: actions/download-artifact@v4
        with:
          name: typewriter-bot-linux-native-cli
          path: artifacts/linux

      - name: Download Linux GUI
        uses: actions/download-artifact@v4
        with:
          name: typewriter-bot-linux-native-gui
          path: artifacts/linux

      - name: Download macOS CLI
        uses: actions/download-artifact@v4
        with:
          name: typewriter-bot-macos-native-cli
          path: artifacts/macos

      - name: Download macOS GUI
        uses: actions/download-artifact@v4
        with:
          name: typewriter-bot-macos-native-gui
          path: artifacts/macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/typewriter-bot
            artifacts/linux/typewriter-bot-gui
            artifacts/macos/typewriter-bot
            artifacts/macos/typewriter-bot-gui
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true