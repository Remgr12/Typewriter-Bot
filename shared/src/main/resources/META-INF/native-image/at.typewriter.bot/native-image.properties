Args = --initialize-at-build-time=org.slf4j,ch.qos.logback \
       --initialize-at-run-time=kotlin.DeprecationLevel,kotlin.KotlinPackage,kotlin.KotlinVersion,kotlin.jvm.JvmClassMappingKt,kotlin.jvm.JvmName,kotlin.reflect.KClassImpl,kotlin.reflect.KDeclarationContainerImpl,kotlin.reflect.KCallableImpl,kotlin.reflect.KPropertyImpl,kotlin.reflect.KFunctionImpl,kotlinx.coroutines.CoroutineContext,kotlinx.coroutines.Job,kotlinx.coroutines.JobSupport,org.openqa.selenium,io.github.bonigarcia \
       --report-unsupported-elements-at-runtime \
       -H:+ReportExceptionStackTraces \
       --enable-monitoring=heapdump,jfr \
       --no-fallback \
       --allow-incomplete-classpath